<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ログインフォーム（wan.json不要版）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family: system-ui, sans-serif; background:#f3f4f6; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
.box { background:#fff; padding:20px; border-radius:12px; width:340px; box-shadow:0 6px 24px rgba(0,0,0,0.1); }
.box h2 { text-align:center; margin-bottom:1rem; }
.box input, .box button { width:100%; padding:10px; margin:8px 0; border-radius:6px; border:1px solid #ccc; font-size:1rem; }
.box button { background:#2563eb; color:#fff; border:none; cursor:pointer; font-weight:700; }
.box button:hover { background:#1d4ed8; }
.msg { text-align:center; margin-top:8px; min-height:22px; font-weight:600; }
</style>
</head>
<body>
<div class="box">
<h2>ログイン</h2>

<form id="loginForm" novalidate autocomplete="off">
<input type="text" id="email" placeholder="ユーザー名 (例: wan)" required>
<input type="password" id="password" placeholder="パスワード" required>
<button id="loginBtn" type="button">ログイン</button>
</form>

<div class="msg" id="message"></div>
</div>

<script>
const TOKEN = "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";  // ★あなたの Token を入れる
const REPO = "shuminoheya/harutyan-home";

// ★ 固定ユーザーとパスワード（自由に変更可能）
const USERS = {
  "wan": "1234",
  "kusunoki": "abcd",
  "naoto": "pass",
  "iwasakisyouta": "9999",
  "katagiri": "0000"
};

/* ---------------------------
   GitHub API 排他ログイン
---------------------------- */

async function isLocked(user){
  const res = await fetch(`https://raw.githubusercontent.com/${REPO}/main/lock.json`);
  const data = await res.json();
  return data[user] === true;
}

async function getLockSha(){
  const res = await fetch(
    `https://api.github.com/repos/${REPO}/contents/lock.json`,
    { headers:{ Authorization:`token ${TOKEN}` } }
  );
  const meta = await res.json();
  return meta.sha;
}

async function lockUser(user){
  const res = await fetch(`https://raw.githubusercontent.com/${REPO}/main/lock.json`);
  const data = await res.json();
  data[user] = true;

  const sha = await getLockSha();

  await fetch(
    `https://api.github.com/repos/${REPO}/contents/lock.json`,
    {
      method:"PUT",
      headers:{
        Authorization:`token ${TOKEN}`,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        message:`lock ${user}`,
        content:btoa(JSON.stringify(data,null,2)),
        sha
      })
    }
  );
}

async function unlockUser(user){
  const res = await fetch(`https://raw.githubusercontent.com/${REPO}/main/lock.json`);
  const data = await res.json();
  data[user] = false;

  const sha = await getLockSha();

  await fetch(
    `https://api.github.com/repos/${REPO}/contents/lock.json`,
    {
      method:"PUT",
      headers:{
        Authorization:`token ${TOKEN}`,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        message:`unlock ${user}`,
        content:btoa(JSON.stringify(data,null,2)),
        sha
      })
    }
  );
}

/* ---------------------------
   ログイン処理（wan.json不要版）
---------------------------- */

document.getElementById("loginBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!email || !password){
    showMessage("ユーザー名とパスワードを入力してください","red");
    return;
  }

  // ★ ユーザー存在チェック
  if(!(email in USERS)){
    showMessage("ユーザーが存在しません","red");
    return;
  }

  // ★ パスワード照合
  if(USERS[email] !== password){
    showMessage("パスワードが違います","red");
    return;
  }

  // ★ GitHub API 排他チェック
  if(await isLocked(email)){
    showMessage("このアカウントは既にログイン中です","red");
    return;
  }

  showMessage("ログイン中…","#666");

  // ★ ロックする
  await lockUser(email);

  showMessage("ログイン成功: " + email,"green");
});

function showMessage(text,color="#222"){
  const msg = document.getElementById("message");
  msg.style.color = color;
  msg.textContent = text;
}
</script>
</body>
</html>
